[project]
name = "agentprobe"
version = "0.1.0"
description = "Security evaluation for AI agents. Runs prompt injection and exfiltration scenarios against an agent CLI and scores the results."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai", "agent", "security", "prompt-injection", "red-team", "owasp", "mitre-atlas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/jgorodetsky/agentprobe"

[project.scripts]
agentprobe = "agentprobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["agentprobe"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
